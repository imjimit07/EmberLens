services:
  emberlens:
    build: .
    image: emberlens:0.8.0
    container_name: emberlens
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      EMBERLENS_ENV: production
      EMBERLENS_DB: /app/data/emberlens.sqlite
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      EMBERLENS_ADMIN_TOKEN: ${EMBERLENS_ADMIN_TOKEN:-}
      METEOMATICS_USERNAME: ${METEOMATICS_USERNAME:-}
      METEOMATICS_PASSWORD: ${METEOMATICS_PASSWORD:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      - emberlens-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  emberlens-data:
